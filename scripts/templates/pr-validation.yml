name: PR Validation
on:
  workflow_run:
    workflows: [PR Quality Gate, Performance]
    types: [requested, in_progress, completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write
concurrency:
  group: pr-validation-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: __NODE_VERSION__
      - name: Reconcile exact PR, SHA and latest attempts
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { reconcileAndPublish } = require('./scripts/publish-pr-report.js');
            const result = await reconcileAndPublish({ github, context, core });
            if (result?.state === 'FAIL') core.setFailed('PR validation failed; inspect the published report.');
