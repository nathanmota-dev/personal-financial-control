name: Performance
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: performance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evaluate:
    name: Performance checks
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select trusted policy and baseline
        shell: bash
        run: |
          if git cat-file -e "${PR_BASE_SHA}:scripts/quality-gate.config.json"; then
            git show "${PR_BASE_SHA}:scripts/quality-gate.config.json" > "$RUNNER_TEMP/quality-gate.config.json"
            echo "QUALITY_GATE_CONFIG_PATH=$RUNNER_TEMP/quality-gate.config.json" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "${PR_BASE_SHA}:scripts/benchmark-baseline.json"; then
            git show "${PR_BASE_SHA}:scripts/benchmark-baseline.json" > "$RUNNER_TEMP/benchmark-baseline.json"
            echo "BENCHMARK_BASELINE_PATH=$RUNNER_TEMP/benchmark-baseline.json" >> "$GITHUB_ENV"
            echo "BENCHMARK_BASELINE_LABEL=base@${PR_BASE_SHA}:scripts/benchmark-baseline.json" >> "$GITHUB_ENV"
          elif [[ -f scripts/benchmark-baseline.json ]]; then
            echo "BENCHMARK_BASELINE_LABEL=initial reviewed CI reference" >> "$GITHUB_ENV"
          else
            echo "::error::Required CI benchmark baseline is missing."
            exit 1
          fi
      - name: Install gate tools
        run: npm ci --prefix scripts
      - name: Select changed packages
        id: selection
        shell: bash
        run: |
          node scripts/select-projects.js --root . >> "$GITHUB_OUTPUT"
      - name: Run three sequential benchmark pairs and compare medians
        env:
          SELECTED_PROJECTS: ${{ steps.selection.outputs.projects }}
        run: node scripts/run-checks.js --root . --workflow performance --projects "$SELECTED_PROJECTS"
      - name: Publish metric summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/performance.md ]]; then
            cat reports/performance.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: reports/
