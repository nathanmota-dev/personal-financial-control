name: PR Quality Gate
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: quality-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evaluate:
    name: Quality checks
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select trusted policy and baseline
        shell: bash
        run: |
          if git cat-file -e "${PR_BASE_SHA}:scripts/quality-gate.config.json"; then
            git show "${PR_BASE_SHA}:scripts/quality-gate.config.json" > "$RUNNER_TEMP/quality-gate.config.json"
            echo "QUALITY_GATE_CONFIG_PATH=$RUNNER_TEMP/quality-gate.config.json" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "${PR_BASE_SHA}:scripts/baseline.json"; then
            git show "${PR_BASE_SHA}:scripts/baseline.json" > "$RUNNER_TEMP/quality-baseline.json"
            echo "QUALITY_GATE_BASELINE_PATH=$RUNNER_TEMP/quality-baseline.json" >> "$GITHUB_ENV"
            echo "QUALITY_GATE_BASELINE_LABEL=base@${PR_BASE_SHA}:scripts/baseline.json" >> "$GITHUB_ENV"
          else
            echo "QUALITY_GATE_BOOTSTRAP=true" >> "$GITHUB_ENV"
          fi
      - name: Install gate tools
        run: npm ci --prefix scripts
      - name: Run checks and collect reports
        run: node scripts/run-checks.js --root . --workflow quality
      - name: Publish metric summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/quality-gate.md ]]; then
            cat reports/quality-gate.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: reports/
  report:
    name: Publish initial PR report
    needs: evaluate
    if: >-
      always()
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      # workflow_run only starts once its publisher exists on the default branch.
      - name: Check whether the default-branch publisher is installed
        id: publisher
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getContent({
                ...context.repo,
                path: '.github/workflows/pr-validation.yml',
                ref: context.payload.repository.default_branch,
              });
              core.setOutput('bootstrap', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('bootstrap', 'true');
            }
      - uses: actions/checkout@v4
        if: steps.publisher.outputs.bootstrap == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.publisher.outputs.bootstrap == 'true'
        with:
          node-version: "24"
      - name: Wait for all checks and publish the current PR report
        if: steps.publisher.outputs.bootstrap == 'true'
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.evaluate.result }}
        with:
          script: |
            const { waitForWorkflows, reconcileAndPublish } = require('./scripts/publish-pr-report.js');
            const { timedOut } = await waitForWorkflows({ github, context, core });
            const reportContext = {
              ...context,
              repo: context.repo,
              payload: {
                ...context.payload,
                action: 'completed',
                workflow_run: { head_sha: context.payload.pull_request.head.sha },
              },
            };
            const result = await reconcileAndPublish({
              github, context: reportContext, core,
              currentEvaluation: {
                conclusion: process.env.QUALITY_RESULT,
                attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              },
              timedOutWorkflows: timedOut,
            });
            if (result?.state === 'FAIL') core.setFailed('PR validation failed; inspect the published report.');
